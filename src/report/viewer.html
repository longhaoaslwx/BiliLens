<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiliLens 详细报告 · 载入中</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #14161a; color: #e9ecf2;
      font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .box { text-align: center; max-width: 420px; padding: 24px; }
    .spin {
      width: 26px; height: 26px; margin: 0 auto 12px; border-radius: 50%;
      border: 2px solid #303641; border-top-color: #f0729a;
      animation: blspin 0.9s linear infinite;
    }
    @keyframes blspin { to { transform: rotate(360deg); } }
    .tip { color: #9ba4b3; font-size: 12px; margin-top: 10px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin" id="bl-spin"></div>
    <div id="bl-status">正在载入详细报告…</div>
    <div class="tip" id="bl-tip">载入完成后本页会被报告内容替换；报告数据仅在生成本机短暂暂存，渲染后即清除。</div>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
